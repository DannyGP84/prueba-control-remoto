<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opus 5.5 · Animación</title>
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/playfair-display/400-italic.css">
<link rel="stylesheet" href="node_modules/@fontsource/playfair-display/700-italic.css">
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
<style>
  :root { --amber: #ff9a5c; --ink: #f4efe8; --muted: rgba(244,239,232,.72); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: #05070c; }
  #c { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: Inter, system-ui, sans-serif; color: var(--ink); }
  #topfade { position: absolute; left: 0; right: 0; top: 0; height: 620px;
    background: linear-gradient(to bottom, rgba(3,4,8,.82), rgba(3,4,8,.45) 55%, rgba(3,4,8,0)); }
  #progress { position: absolute; top: 96px; left: 90px; right: 90px; display: flex; gap: 14px; }
  #progress i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; position: relative; }
  #progress i b { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: var(--amber); box-shadow: 0 0 18px var(--amber); }

  #intro { position: absolute; top: 190px; left: 0; right: 0; text-align: center; }
  #intro .kicker { font-weight: 600; font-size: 34px; letter-spacing: .38em; text-transform: uppercase; color: var(--amber); }
  #intro .l1 { font-weight: 800; font-size: 92px; letter-spacing: -.02em; margin-top: 26px; line-height: 1; }
  #intro .l2 { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 124px; line-height: 1.08; margin-top: 8px;
    color: #ffac74; text-shadow: 0 0 34px rgba(255,130,70,.55), 0 0 2px rgba(255,220,190,.6); }
  #intro .sub { font-size: 38px; color: var(--muted); margin-top: 22px; }
  .ch { display: inline-block; white-space: pre; }

  #step { position: absolute; top: 170px; left: 90px; right: 90px; display: flex; gap: 34px; align-items: flex-start; }
  #step .num { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 150px; line-height: .9; color: var(--amber);
    text-shadow: 0 0 40px rgba(255,140,80,.45); min-width: 150px; }
  #step .txt { padding-top: 8px; }
  #step .lbl { font-weight: 600; font-size: 28px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
  #step .title { font-weight: 800; font-size: 70px; line-height: 1.05; letter-spacing: -.015em; margin-top: 14px; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  #step .subt { font-size: 36px; line-height: 1.3; color: var(--muted); margin-top: 18px; }

  #outro { position: absolute; top: 230px; left: 0; right: 0; text-align: center; }
  #outro .title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 170px; line-height: 1; color: var(--amber);
    text-shadow: 0 0 60px rgba(255,140,80,.5); }
  #outro .sub { font-weight: 800; font-size: 58px; margin-top: 24px; }
  #outro .note { font-size: 36px; color: var(--muted); margin-top: 18px; }
  #source { position: absolute; bottom: 110px; left: 0; right: 0; text-align: center; font-size: 28px; letter-spacing: .08em; color: rgba(244,239,232,.55); }
  #hint { position: fixed; bottom: 12px; left: 12px; color: #aaa; font: 14px Inter, sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <div id="topfade"></div>
    <div id="progress"></div>
    <div id="intro"><div class="kicker"></div><div class="l1"></div><div class="l2"></div><div class="sub"></div></div>
    <div id="step"><div class="num"></div><div class="txt"><div class="lbl"></div><div class="title"></div><div class="subt"></div></div></div>
    <div id="outro"><div class="title"></div><div class="sub"></div><div class="note"></div></div>
    <div id="source"></div>
  </div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
